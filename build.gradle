apply plugin: "java"

version = '1.0.0'

sourceSets.main.java.srcDirs = ["src"]

repositories{
    mavenCentral()
    maven{ url = "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven{ url = 'https://www.jitpack.io' }
}

java{
    targetCompatibility = 8
    sourceCompatibility = JavaVersion.VERSION_17
}

ext{
    //the build number that this mod is made for
    mindustryVersion = 'v155.4'
    jabelVersion = "93fde537c7"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

//java 8 backwards compatibility flag
allprojects{
    tasks.withType(JavaCompile).tap{
        configureEach{
            options.compilerArgs.addAll(['--release', '8'])
        }
    }
}

dependencies{
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"

    annotationProcessor "com.github.Anuken:jabel:$jabelVersion"
}

//force arc version
configurations.configureEach{
    resolutionStrategy.eachDependency { details ->
        if(details.requested.group == 'com.github.Anuken.Arc'){
            details.useVersion "$mindustryVersion"
        }
    }
}

tasks.register('jarAndroid'){
    dependsOn "jar"

    doLast{
        if(!sdkRoot || !new File(sdkRoot).exists()){
            logger.warn("No valid Android SDK found. Falling back to desktop artifact for local deploy.")
            copy{
                from "build/libs/${project.name}Desktop.jar"
                into "build/libs"
                rename { _ -> "${project.name}Android.jar" }
            }
            return
        }

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }

        if(!platformRoot){
            logger.warn("No android.jar found in SDK. Falling back to desktop artifact for local deploy.")
            copy{
                from "build/libs/${project.name}Desktop.jar"
                into "build/libs"
                rename { _ -> "${project.name}Android.jar" }
            }
            return
        }

        //collect dependencies needed for desugaring
        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect{ "--classpath $it.path" }.join(" ")

        def d8 = isWindows ? "d8.bat" : "d8"

        //dex and desugar files - this requires d8 in your PATH
        "$d8 $dependencies --min-api 14 --output ${project.name}Android.jar ${project.name}Desktop.jar"
                .execute(null, new File("build/libs")).waitForProcessOutput(System.out, System.err)
    }
}

jar{
    archiveFileName = "${project.name}Desktop.jar"

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.json"
    }

    from("assets/"){
        include "**"
    }
}

tasks.register('deploy', Jar){
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${project.name}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from{ [zipTree("build/libs/${project.name}Desktop.jar"), zipTree("build/libs/${project.name}Android.jar")] }

    doLast{
        delete{
            delete "build/libs/${project.name}Android.jar"
        }
    }
}

def mergedArchiveBase = project.name
def buildOutDir = new File(rootDir.parentFile, "构建/${project.name}")
def projectBuildOutDir = new File(projectDir, "构建/${project.name}")
def distDir = new File(projectDir, "dist")

tasks.register("zipMerged", Zip){
    group = "build"
    description = "Packages a zip artifact from merged desktop+android jar."
    dependsOn tasks.named("deploy")
    archiveFileName = "${mergedArchiveBase}.zip"
    destinationDirectory = layout.buildDirectory.dir("libs")
    from({ zipTree("build/libs/${mergedArchiveBase}.jar") })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("copyMergedJarToDist", Copy){
    dependsOn tasks.named("deploy")
    from("build/libs/${mergedArchiveBase}.jar")
    into(distDir)
    rename{ _ -> "${mergedArchiveBase}.jar" }
    doNotTrackState("Copying release artifacts to dist for convenience.")
}

tasks.register("copyMergedZipToDist", Copy){
    dependsOn tasks.named("zipMerged")
    from(tasks.named("zipMerged").flatMap{ it.archiveFile })
    into(distDir)
    rename{ _ -> "${mergedArchiveBase}.zip" }
    doNotTrackState("Copying release artifacts to dist for convenience.")
}

tasks.register("copyMergedJarToBuildDir", Copy){
    dependsOn tasks.named("deploy")
    from("build/libs/${mergedArchiveBase}.jar")
    into(buildOutDir)
    rename{ _ -> "${mergedArchiveBase}-${project.version}.jar" }
    doNotTrackState("Copies release artifacts to workspace build output.")
}

tasks.register("copyMergedZipToBuildDir", Copy){
    dependsOn tasks.named("zipMerged")
    from(tasks.named("zipMerged").flatMap{ it.archiveFile })
    into(buildOutDir)
    rename{ _ -> "${mergedArchiveBase}-${project.version}.zip" }
    doNotTrackState("Copies release artifacts to workspace build output.")
}

tasks.register("copyMergedJarToProjectBuildDir", Copy){
    dependsOn tasks.named("deploy")
    from("build/libs/${mergedArchiveBase}.jar")
    into(projectBuildOutDir)
    rename{ _ -> "${mergedArchiveBase}-${project.version}.jar" }
    doNotTrackState("Copies release artifacts to project-local build output.")
}

tasks.register("copyMergedZipToProjectBuildDir", Copy){
    dependsOn tasks.named("zipMerged")
    from(tasks.named("zipMerged").flatMap{ it.archiveFile })
    into(projectBuildOutDir)
    rename{ _ -> "${mergedArchiveBase}-${project.version}.zip" }
    doNotTrackState("Copies release artifacts to project-local build output.")
}

tasks.named("deploy").configure{
    finalizedBy tasks.named("zipMerged")
    finalizedBy tasks.named("copyMergedJarToDist")
    finalizedBy tasks.named("copyMergedJarToBuildDir")
    finalizedBy tasks.named("copyMergedJarToProjectBuildDir")
}

tasks.named("zipMerged").configure{
    finalizedBy tasks.named("copyMergedZipToDist")
    finalizedBy tasks.named("copyMergedZipToBuildDir")
    finalizedBy tasks.named("copyMergedZipToProjectBuildDir")
}
